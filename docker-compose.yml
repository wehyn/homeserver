services:
  nimbus:
    build: .
    container_name: nimbus-dashboard
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      PORT: 10000
      DATABASE_PATH: /app/data/nimbus.db
      MEMORY_AGENT_URL: http://metrics-agent:8787
      HARDWARE_AGENT_URL: http://metrics-agent:8787
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
      DOCKER_AGENT_URL: http://metrics-agent:8787
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:-}
    volumes:
      - nimbus-data:/app/data

  metrics-agent:
    build:
      context: .
      dockerfile: Dockerfile.metrics-agent
    container_name: nimbus-metrics-agent
    restart: unless-stopped
    # RAPL energy_uj is root-readable on the host; keep its sysfs mounts read-only.
    user: "0:0"
    environment:
      AGENT_PORT: 8787
      SYS_ROOT: /host/sys
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:-}
      DOCKER_SERVICES_ROOT: /host/services
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /etc/passwd
        target: /host/etc/passwd
        read_only: true
      - type: bind
        source: /sys/devices/virtual/thermal
        target: /host/sys/devices/virtual/thermal
        read_only: true
      - type: bind
        source: /sys/devices/virtual/powercap
        target: /host/sys/devices/virtual/powercap
        read_only: true
      - type: bind
        source: /sys/class/hwmon
        target: /host/sys/class/hwmon
        read_only: true
      - type: bind
        source: /sys/class/powercap
        target: /host/sys/class/powercap
        read_only: true
      - type: bind
        source: ${HOME}/services
        target: /host/services
        read_only: true

volumes:
  nimbus-data:
