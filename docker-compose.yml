services:
  nimbus:
    build: .
    container_name: nimbus-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/nimbus.db
      MEMORY_AGENT_URL: http://metrics-agent:8787
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
      DOCKER_AGENT_URL: ${DOCKER_AGENT_URL:-http://metrics-agent:8787}
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:-}
      NIMBUS_NOTIFICATION_WEBHOOK_URL: ${NIMBUS_NOTIFICATION_WEBHOOK_URL:-}
    volumes:
      - nimbus-data:/app/data
      # Do not mount the Docker socket here. Configure the separate read-only adapter instead.
      # - /var/run/docker.sock:/var/run/docker.sock:ro

  metrics-agent:
    build:
      context: .
      dockerfile: Dockerfile.metrics-agent
    container_name: nimbus-metrics-agent
    restart: unless-stopped
    environment:
      AGENT_PORT: 8787
      MEMORY_AGENT_TOKEN: ${MEMORY_AGENT_TOKEN:-}
      # This must point to a separately deployed, narrowly scoped read-only Docker API adapter.
      # The metrics agent intentionally has no Docker socket mount.
      DOCKER_DISCOVERY_URL: ${DOCKER_DISCOVERY_URL:-}
      DOCKER_DISCOVERY_TOKEN: ${DOCKER_DISCOVERY_TOKEN:-}
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:-}
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /etc/passwd
        target: /host/etc/passwd
        read_only: true
      - type: bind
        source: /sys/class/thermal
        target: /host/sys/class/thermal
        read_only: true
      - type: bind
        source: /sys/class/net
        target: /host/sys/class/net
        read_only: true
      - type: bind
        source: /sys/block
        target: /host/sys/block
        read_only: true

volumes:
  nimbus-data:
